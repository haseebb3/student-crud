<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student CRUD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <h5 class="text-center bg-warning">Student CRUD</h5>
    <div class="section">
    <div class="container-fluid">
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <form id="form">
              <div class="form-group">
                <label for="fname">Enter first name : </label>
                <input type="text" class="form-control" id="fname">
              </div>
              <div class="form-group">
                <label for="lname">Enter first name : </label>
                <input type="text" class="form-control" id="lname">
              </div>
              <div class="form-group">
                <label for="email">Enter first name : </label>
                <input type="text" class="form-control" id="email">
              </div>
              <div class="form-group">
                <label for="contact">Enter first name : </label>
                <input type="text" class="form-control" id="contact">
              </div>

              <button class="btn btn-block btn-sm btn-primary" id="addStudentBtn">Add student</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script src="./assets/js/app.js"></script>
</body>
</html>
